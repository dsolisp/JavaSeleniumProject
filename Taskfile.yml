version: "3"

# ──────────────────────────────────────────────────────────────────────────────
# QA Portfolio — Java / Selenium / JUnit 5 Stack
# Interface contract: task names are IDENTICAL across all 5 repos.
# ──────────────────────────────────────────────────────────────────────────────

vars:
  ALLURE_RESULTS: target/allure-results
  ALLURE_REPORT:  target/allure-report
  AUTH_FILE:      .auth/sauce.json
  MVN:            ./mvnw
  QA_PRACTICE_APP: ../qa-practice-app

tasks:

  # ── Core ──────────────────────────────────────────────────────────────────

  test:
    desc: "Run the full test suite"
    cmds:
      - "{{.MVN}} verify -Pallure"

  test:sauce:
    desc: "Run SauceDemo E2E tests only"
    cmds:
      - "{{.MVN}} verify -Pallure -Dgroups=sauce"

  test:advanced:
    desc: "Run Advanced Interactions tests (E1-E9)"
    cmds:
      - "{{.MVN}} verify -Pallure -Dgroups=advanced"

  test:api:
    desc: "Run API tests (RestAssured)"
    cmds:
      - "{{.MVN}} verify -Pallure -Dgroups=api"

  test:a11y:
    desc: "Run Accessibility tests"
    cmds:
      - "{{.MVN}} verify -Pallure -Dgroups=a11y"

  test:arch:
    desc: "Run ArchUnit architecture guardrails"
    cmds:
      - "{{.MVN}} test -Dgroups=architecture"

  test:headless:
    desc: "Run full suite in headless mode"
    cmds:
      - "{{.MVN}} verify -Pallure"
    env:
      HEADLESS: "true"

  # ── Quality ───────────────────────────────────────────────────────────────

  lint:
    desc: "Run Spotless + Checkstyle (0 warnings policy)"
    cmds:
      - "{{.MVN}} spotless:check checkstyle:check"

  lint:fix:
    desc: "Auto-apply Spotless formatting"
    cmds:
      - "{{.MVN}} spotless:apply"

  audit:
    desc: "Run violation audit (must return 0)"
    cmds:
      - bash scripts/audit_violations.sh
      - bash scripts/check-sync.sh

  # ── Practice App ──────────────────────────────────────────────────────────

  practice:up:
    desc: "Start qa-practice-app on localhost:8080"
    cmds:
      - docker compose -f {{.QA_PRACTICE_APP}}/docker-compose.yml up -d
      - echo "Practice app running at http://localhost:8080"

  practice:down:
    desc: "Stop qa-practice-app"
    cmds:
      - docker compose -f {{.QA_PRACTICE_APP}}/docker-compose.yml down

  # ── Auth ──────────────────────────────────────────────────────────────────

  auth:clear:
    desc: "Delete cached auth state (force fresh login)"
    cmds:
      - rm -f {{.AUTH_FILE}}
      - echo "Auth cache cleared."

  # ── Allure ────────────────────────────────────────────────────────────────

  allure:open:
    desc: "Generate and open Allure report"
    cmds:
      - allure generate {{.ALLURE_RESULTS}} -o {{.ALLURE_REPORT}} --clean
      - allure open {{.ALLURE_REPORT}}

  allure:clean:
    desc: "Remove allure results and report"
    cmds:
      - rm -rf {{.ALLURE_RESULTS}} {{.ALLURE_REPORT}}

  # ── Setup ─────────────────────────────────────────────────────────────────

  setup:
    desc: "Download dependencies and compile"
    cmds:
      - "{{.MVN}} dependency:resolve compile"

  # ── CI convenience ────────────────────────────────────────────────────────

  ci:
    desc: "Full CI pipeline (lint + audit + test + arch)"
    cmds:
      - task: lint
      - task: audit
      - task: test:arch
      - task: test
