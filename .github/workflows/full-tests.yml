name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui-sauce
          - ui-practice
          - backend
          - visual
          - bdd
          - performance
          - playwright

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEADLESS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright browsers (Chromium)
        if: ${{ inputs.suite == 'all' || inputs.suite == 'playwright' }}
        run: mvn -q org.codehaus.mojo:exec-maven-plugin:3.5.0:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run Unit Tests
        run: mvn test -Dtest="**/unit/*Test"

      - name: Run Sauce UI tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'ui-sauce' }}
        run: mvn test -Dtest="**/ui/sauce/*Test" -DHEADLESS=true || true

      - name: Run Practice UI tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'ui-practice' }}
        run: mvn test -Dtest="**/ui/practice/*Test" -DHEADLESS=true || true

      - name: Run Backend tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'backend' }}
        run: mvn test -Dtest="**/backend/*Test" -DHEADLESS=true || true

      - name: Run Visual tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'visual' }}
        run: mvn test -Dtest="**/ui/visual/*Test" -DHEADLESS=true || true

      - name: Run Performance tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'performance' }}
        run: mvn test -Dtest="**/performance/*Test" -DHEADLESS=true || true

      - name: Run BDD tests
        if: ${{ inputs.suite == 'all' || inputs.suite == 'bdd' }}
        run: mvn test -Dtest="CucumberTestRunner" -DHEADLESS=true || true

      - name: Run Playwright Java smoke
        if: ${{ inputs.suite == 'all' || inputs.suite == 'playwright' }}
        run: mvn test -Dtest="com.automation.playwright.PlaywrightSmokeTest" -DHEADLESS=true || true

      - name: Upload Allure results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: target/allure-results/
          if-no-files-found: warn

      - name: Generate metrics summary.json
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TEST_SUITE: ${{ inputs.suite }}
          ALLURE_RESULTS_DIR: target/allure-results
        run: node scripts/generate_summary_json.js

      - name: Upload summary.json to Cloudflare R2 (metrics)
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp summary.json s3://qa-portfolio-metrics/${{ github.event.repository.name }}/${{ github.run_id }}.json --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results --clean -o allure-report

      - name: Upload Report to Cloudflare R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync allure-report/ s3://qa-portfolio-allure/${{ github.event.repository.name }}/${{ github.run_id }}/ --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Upload Allure HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          if-no-files-found: warn

      - name: Add Report URL to Summary
        if: always()
        env:
          VAR_R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          SECRET_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          {
            echo "### Allure report"
            echo ""
            echo "GitHub **does not** expose artifact files at a browsable \`github.com/.../index.html\` URL (those links always 404)."
            echo "Use the **allure-report-${{ github.run_id }}** artifact: download, unzip, open \`index.html\` locally."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Normalize (trim, remove trailing slash, ensure scheme) to avoid relative links.
          # NOTE: If R2_PUBLIC_URL is a *secret*, GitHub can mask it as `***` even in
          # Step Summary output, which breaks the link (it becomes relative and resolves
          # under github.com/actions/runs/...).
          #
          # Use repo variable `vars.R2_PUBLIC_URL` (not secret) for public domains.
          R2_PUBLIC_URL="${VAR_R2_PUBLIC_URL:-}"
          if [ -z "${R2_PUBLIC_URL:-}" ]; then
            R2_PUBLIC_URL="${SECRET_R2_PUBLIC_URL:-}"
          fi

          R2_PUBLIC_URL="$(echo "${R2_PUBLIC_URL:-}" | xargs)"
          R2_PUBLIC_URL="${R2_PUBLIC_URL%/}"
          if [ -n "$R2_PUBLIC_URL" ] && [[ ! "$R2_PUBLIC_URL" =~ ^https?:// ]]; then
            R2_PUBLIC_URL="https://${R2_PUBLIC_URL}"
          fi

          if [ -n "$R2_PUBLIC_URL" ] && [[ "$R2_PUBLIC_URL" != *"github.com"* ]] && [[ "$R2_PUBLIC_URL" != "***" ]]; then
            FINAL_URL="${R2_PUBLIC_URL}/${{ github.event.repository.name }}/${{ github.run_id }}/index.html"
            echo "Hosted copy (R2): [index.html](${FINAL_URL})" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$R2_PUBLIC_URL" ]; then
            echo "⚠️ Set **R2_PUBLIC_URL** as a **Repository Variable** (not secret) to avoid masking.\n- Go to **Settings → Secrets and variables → Actions → Variables**\n- Add **R2_PUBLIC_URL** = your public base (e.g. \`https://pub-....r2.dev\`)\n\nDo not use a \`github.com\` URL." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Optional: set **R2_PUBLIC_URL** to that public base URL to get a hosted link above." >> "$GITHUB_STEP_SUMMARY"
          fi
