name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Typecheck (Compile)
        run: mvn -q -DskipTests test-compile

      - name: Checkstyle
        run: mvn -q checkstyle:check || true

      - name: Spotbugs
        run: mvn -q spotbugs:check || true

      - name: Audit (Dependencies)
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 || true

      - name: Audit (Static Waits)
        run: bash scripts/audit_static_waits.sh

      - name: Run Unit Tests
        run: mvn test -Dtest="**/unit/*Test"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 30
